<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>22 HUB v6</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#727986;--line:#e7e9ee;--soft:#f1f3f6;--accent:#111827}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:18px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:30px}.sub{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;background:var(--soft);cursor:pointer}.btn.dark{background:var(--accent);color:#fff}
.note{background:var(--soft);padding:12px;border-radius:12px;color:var(--muted);font-size:13px}.events{display:grid;gap:8px}.event{border:1px solid var(--line);border-radius:14px;padding:12px}
.actions{display:flex;gap:6px;margin-top:8px}.actions button{border:0;border-radius:9px;padding:6px 8px;background:var(--soft);font-size:11px;font-weight:700}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;padding:20px}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:18px;padding:18px;width:min(600px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
@media(max-width:720px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>22 HUB</h1><div class="sub">2학년 2반 전용 HUB</div></div>
    <button class="btn dark" onclick="openModal()">＋ 수행평가 추가</button>
  </div>

  <div class="grid">
    <section class="card">
      <h2>🍚 오늘의 급식</h2>
      <div id="mealBox" class="note">급식 정보를 불러오는 중...</div>
    </section>

    <section class="card">
      <h2>📅 가까운 학사일정</h2>
      <div id="schoolScheduleBox" class="note">학사일정을 불러오는 중...</div>
    </section>
  </div>

  <section class="card">
    <h2>✅ 다가오는 수행평가</h2>
    <div id="assessmentList" class="events"></div>
    <div id="firebaseStatus" class="sub" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <h2>📅 내 시간표</h2>
    <div class="note">v5의 학생별 시간표 기능을 다음 단계에서 이 영역에 다시 통합합니다.</div>
  </section>
</div>

<div id="modalBg" class="modal-bg">
  <div class="modal">
    <h2 id="modalTitle">수행평가 일정 추가</h2>
    <input type="hidden" id="editId">
    <div class="form">
      <div><label>과목</label><input id="subject" placeholder="예: 화학"></div>
      <div><label>종류</label><select id="type"><option>수행평가</option><option>과제</option><option>시험</option><option>기타</option></select></div>
      <div class="full"><label>제목</label><input id="title" placeholder="예: 중화적정 보고서"></div>
      <div><label>날짜</label><input id="date" type="date"></div>
      <div><label>작성자 표시(선택)</label><input id="writer" placeholder="예: 2반 학생"></div>
      <div class="full"><label>메모</label><textarea id="memo"></textarea></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn dark" onclick="saveAssessment()">저장</button>
    </div>
  </div>
</div>

<script type="module">
const APP_CONFIG = {
  neis: {
    key: "",
    eduCode: "",
    schoolCode: ""
  },
  firebase: {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  }
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

let db = null;
let assessments = [];

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function dday(s){const n=new Date();n.setHours(0,0,0,0);const d=new Date(s+"T00:00:00");const x=Math.ceil((d-n)/86400000);return x===0?"D-DAY":x>0?"D-"+x:"D+"+Math.abs(x);}

function renderAssessments(){
  const box=document.getElementById("assessmentList");
  box.innerHTML=assessments.length?assessments.map(e=>`
    <div class="event">
      <b>${esc(e.subject)} · ${esc(e.title)}</b><br>
      <span class="sub">${esc(e.date)} · ${dday(e.date)} · ${esc(e.type)}</span>
      ${e.memo?`<div class="sub">${esc(e.memo)}</div>`:""}
      <div class="actions">
        <button onclick="editAssessment('${e.id}')">수정</button>
        <button onclick="deleteAssessment('${e.id}')">삭제</button>
      </div>
    </div>`).join(""):`<div class="note">등록된 수행평가 일정이 없습니다.</div>`;
}

async function initFirebase(){
  const s=document.getElementById("firebaseStatus");
  if(!APP_CONFIG.firebase.apiKey || !APP_CONFIG.firebase.projectId || !APP_CONFIG.firebase.appId){
    s.textContent="Firebase 설정값을 넣으면 학생들이 같은 일정을 실시간으로 공유할 수 있습니다.";
    renderAssessments();
    return;
  }
  try{
    const app=initializeApp(APP_CONFIG.firebase);
    const auth=getAuth(app);
    db=getFirestore(app);
    await signInAnonymously(auth);
    s.textContent="실시간 공유 연결됨";
    const q=query(collection(db,"assessments"),orderBy("date","asc"));
    onSnapshot(q,snap=>{
      assessments=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderAssessments();
    });
  }catch(e){s.textContent="Firebase 연결 실패: "+e.message;}
}

window.openModal=function(){
  document.getElementById("editId").value="";
  ["subject","title","date","writer","memo"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("type").value="수행평가";
  document.getElementById("modalTitle").textContent="수행평가 일정 추가";
  document.getElementById("modalBg").classList.add("open");
}
window.closeModal=function(){document.getElementById("modalBg").classList.remove("open");}
window.editAssessment=function(id){
  const e=assessments.find(x=>x.id===id); if(!e)return;
  document.getElementById("editId").value=id;
  document.getElementById("subject").value=e.subject||"";
  document.getElementById("type").value=e.type||"수행평가";
  document.getElementById("title").value=e.title||"";
  document.getElementById("date").value=e.date||"";
  document.getElementById("writer").value=e.writer||"";
  document.getElementById("memo").value=e.memo||"";
  document.getElementById("modalTitle").textContent="수행평가 일정 수정";
  document.getElementById("modalBg").classList.add("open");
}
window.saveAssessment=async function(){
  if(!db){alert("Firebase 설정이 먼저 필요합니다.");return;}
  const id=document.getElementById("editId").value;
  const data={
    subject:document.getElementById("subject").value.trim(),
    type:document.getElementById("type").value,
    title:document.getElementById("title").value.trim(),
    date:document.getElementById("date").value,
    writer:document.getElementById("writer").value.trim(),
    memo:document.getElementById("memo").value.trim(),
    updatedAt:serverTimestamp()
  };
  if(!data.subject||!data.title||!data.date){alert("과목, 제목, 날짜를 입력해 주세요.");return;}
  if(id) await updateDoc(doc(db,"assessments",id),data);
  else {data.createdAt=serverTimestamp(); await addDoc(collection(db,"assessments"),data);}
  closeModal();
}
window.deleteAssessment=async function(id){
  if(!db)return;
  if(confirm("이 일정을 삭제할까요? 모든 학생 화면에서 사라집니다.")) await deleteDoc(doc(db,"assessments",id));
}

function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
async function loadMeal(){
  const box=document.getElementById("mealBox");
  if(!APP_CONFIG.neis.eduCode||!APP_CONFIG.neis.schoolCode){box.textContent="NEIS 학교 코드를 넣으면 오늘 급식이 자동으로 표시됩니다.";return;}
  try{
    const p=new URLSearchParams({Type:"json",pIndex:"1",pSize:"10",ATPT_OFCDC_SC_CODE:APP_CONFIG.neis.eduCode,SD_SCHUL_CODE:APP_CONFIG.neis.schoolCode,MLSV_YMD:ymd(new Date())});
    if(APP_CONFIG.neis.key)p.set("KEY",APP_CONFIG.neis.key);
    const data=await (await fetch("https://open.neis.go.kr/hub/mealServiceDietInfo?"+p)).json();
    const rows=data?.mealServiceDietInfo?.[1]?.row||[];
    const row=rows.find(r=>String(r.MMEAL_SC_NM||"").includes("중식"))||rows[0];
    box.innerHTML=row?String(row.DDISH_NM||"").replace(/<br\s*\/?>/gi,"<br>"):"오늘 등록된 급식이 없습니다.";
  }catch(e){box.textContent="급식 정보를 불러오지 못했습니다.";}
}
async function loadSchoolSchedule(){
  const box=document.getElementById("schoolScheduleBox");
  if(!APP_CONFIG.neis.eduCode||!APP_CONFIG.neis.schoolCode){box.textContent="NEIS 학교 코드를 넣으면 학사일정이 자동으로 표시됩니다.";return;}
  try{
    const from=new Date(),to=new Date();to.setDate(to.getDate()+45);
    const p=new URLSearchParams({Type:"json",pIndex:"1",pSize:"30",ATPT_OFCDC_SC_CODE:APP_CONFIG.neis.eduCode,SD_SCHUL_CODE:APP_CONFIG.neis.schoolCode,AA_FROM_YMD:ymd(from),AA_TO_YMD:ymd(to)});
    if(APP_CONFIG.neis.key)p.set("KEY",APP_CONFIG.neis.key);
    const data=await (await fetch("https://open.neis.go.kr/hub/SchoolSchedule?"+p)).json();
    const rows=data?.SchoolSchedule?.[1]?.row||[];
    box.innerHTML=rows.length?rows.slice(0,8).map(r=>`<div><b>${esc(r.AA_YMD)} · ${esc(r.EVENT_NM)}</b></div>`).join(""):"가까운 학사일정이 없습니다.";
  }catch(e){box.textContent="학사일정을 불러오지 못했습니다.";}
}
loadMeal();loadSchoolSchedule();initFirebase();
</script>
</body>
</html>
